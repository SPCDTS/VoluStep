<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024"
     height="500"
     viewBox="0 0 1024 500"
     role="img"
     aria-labelledby="title description">
  <title id="title">VoluStep Google Play feature graphic</title>
  <desc id="description">VoluStep wordmark and a precise rising volume mapping curve in the product's green, charcoal, and off-white palette.</desc>
  <metadata>
    Brand: VoluStep
    Source audit: app/src/main/res/drawable/ic_launcher_foreground.xml,
    app/src/main/res/values/colors.xml, and app/src/main/java/dev/spcdts/volumemapper/ui/Theme.kt.
    Visual system: launcher curve geometry, #1DB954 dark-theme primary,
    #121212 background, #181818 surface, #353535 outline, #B3B3B3 secondary text,
    and #F6F6F6 light neutral.
    No external artwork or generative imagery is used.
    Created: 2026-08-25.
  </metadata>

  <!-- Opaque full-bleed background; export is flattened to 24-bit RGB. -->
  <rect width="1024" height="500" fill="#121212"/>

  <!-- Product-mark tile. -->
  <rect x="66" y="66" width="368" height="368" rx="76"
        fill="#181818" stroke="#353535" stroke-width="2"/>
  <path d="M130 348 L214 306 L284 231 L376 171"
        fill="none"
        stroke="#F6F6F6"
        stroke-width="20"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <g fill="#181818" stroke="#F6F6F6" stroke-width="8">
    <circle cx="130" cy="348" r="17"/>
    <circle cx="214" cy="306" r="17"/>
    <circle cx="376" cy="171" r="17"/>
  </g>
  <circle cx="284" cy="231" r="38" fill="#1DB954" opacity="0.42"/>
  <circle cx="284" cy="231" r="17" fill="#1DB954" stroke="#F6F6F6" stroke-width="8"/>

  <!-- Locale-neutral product name; both app locales use VoluStep. -->
  <text x="510" y="238"
        fill="#F6F6F6"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="88"
        font-weight="600"
        letter-spacing="-3">VoluStep</text>

  <!-- A compact response curve replaces explanatory marketing copy. -->
  <path d="M516 342 L596 334 L668 314 L760 306 L856 270"
        fill="none"
        stroke="#1DB954"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <g fill="#121212" stroke="#B3B3B3" stroke-width="4">
    <circle cx="516" cy="342" r="9"/>
    <circle cx="596" cy="334" r="9"/>
    <circle cx="668" cy="314" r="9"/>
    <circle cx="856" cy="270" r="9"/>
  </g>
  <circle cx="760" cy="306" r="17" fill="#1DB954" opacity="0.42"/>
  <circle cx="760" cy="306" r="9" fill="#1DB954" stroke="#F6F6F6" stroke-width="4"/>
</svg>
