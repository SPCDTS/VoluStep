name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 校验 Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: 安装 Android 37 SDK
        run: sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: 单元测试与 Debug / Release 门禁
        run: >-
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
          :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease :app:assembleRelease
      - name: 保存设备测试安装包
        uses: actions/upload-artifact@v4
        with:
          name: device-test-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 7
      - name: 保存单元测试和 Lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  device:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [28, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/download-artifact@v4
        with:
          name: device-test-apks
          path: app/build/outputs/apk
      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 运行设备测试与真实输入链路
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            python3 scripts/run-device-tests.py --serial emulator-5554
            pwsh -File scripts/emulator-e2e-test.ps1 -Serial emulator-5554 -SkipBuild
      - name: 保存设备诊断
        if: always()
        run: |
          mkdir -p artifacts/ci
          adb logcat -d > artifacts/ci/logcat.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-api-${{ matrix.api }}
          path: artifacts/ci/
          retention-days: 14
