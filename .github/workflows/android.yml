name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 校验 Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: 安装 Android 37 SDK
        run: sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: 校验测试入口上限
        shell: bash
        run: |
          test_count="$(git grep -h '^[[:space:]]*@Test' -- app/src/test app/src/androidTest | wc -l)"
          echo "Android test entries: ${test_count}/30"
          if [ "${test_count}" -gt 30 ]; then
            echo "Test entry limit exceeded"
            exit 1
          fi
      - name: 单元测试、AndroidTest 编译与 Debug 门禁
        run: >-
          ./gradlew --no-daemon
          :app:testDebugUnitTest
          :app:compileDebugAndroidTestKotlin
          :app:lintDebug
          :app:assembleDebug
      - name: 无生产密钥的 Release Lint、APK 与 AAB 门禁
        run: >-
          ./gradlew --no-daemon
          :app:lintRelease
          :app:assembleRelease
          :app:bundleRelease
